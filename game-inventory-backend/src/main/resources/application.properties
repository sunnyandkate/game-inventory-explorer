spring.application.name=inventory

# Render Connection Matrix: Force secure SSL communication & verify server identity
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/rpg_game?useSSL=true&requireSSL=true&verifyServerCertificate=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate JPA Orchestration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Application Secrets Management
ADMIN_SECRET=${ADMIN_SECRET:admin_password}
